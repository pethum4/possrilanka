<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 500" width="100%" height="100%">
  <defs>
    <linearGradient id="screenGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="bodyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#334155" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="standGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#64748b" />
      <stop offset="50%" stop-color="#94a3b8" />
      <stop offset="100%" stop-color="#475569" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0f766e" />
      <stop offset="100%" stop-color="#14b8a6" />
    </linearGradient>
    <filter id="dropShadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#0f172a" flood-opacity="0.18" />
    </filter>
  </defs>

  <!-- Background Base Canvas -->
  <rect width="600" height="500" rx="16" fill="#f8fafc" />
  <circle cx="300" cy="240" r="190" fill="#f1f5f9" />

  <!-- Base Stand Shadow -->
  <ellipse cx="300" cy="430" rx="140" ry="20" fill="#cbd5e1" opacity="0.6" />

  <!-- Base Stand Plate -->
  <rect x="190" y="415" width="220" height="24" rx="12" fill="url(#standGrad)" />
  <rect x="210" y="418" width="180" height="4" rx="2" fill="#e2e8f0" opacity="0.4" />
  
  <!-- Stand Neck / Hinge -->
  <path d="M 270 415 L 285 280 L 315 280 L 330 415 Z" fill="url(#bodyGrad)" />
  <rect x="280" y="270" width="40" height="25" rx="6" fill="#475569" />

  <!-- Main POS Screen Frame (Bezel Free) -->
  <g filter="url(#dropShadow)">
    <rect x="90" y="70" width="420" height="280" rx="14" fill="url(#bodyGrad)" />
    <!-- Screen Bezel Accent -->
    <rect x="94" y="74" width="412" height="272" rx="10" fill="#090d16" />
    <!-- Display Glass -->
    <rect x="104" y="84" width="392" height="252" rx="6" fill="url(#screenGrad)" />

    <!-- POS UI Mockup on Screen -->
    <!-- Top Bar -->
    <rect x="104" y="84" width="392" height="30" rx="4" fill="#0f766e" />
    <circle cx="120" cy="99" r="5" fill="#f59e0b" />
    <text x="135" y="103" fill="#ffffff" font-family="system-ui, sans-serif" font-size="11" font-weight="bold">POS SL Professional v4.2</text>
    <rect x="420" y="90" width="64" height="18" rx="3" fill="#134e4a" />
    <text x="430" y="103" fill="#5eead4" font-family="system-ui, sans-serif" font-size="10">ONLINE</text>

    <!-- Left Category Panel -->
    <rect x="112" y="122" width="75" height="204" rx="4" fill="#1e293b" />
    <rect x="116" y="128" width="67" height="24" rx="3" fill="#0f766e" />
    <text x="122" y="144" fill="#ffffff" font-family="system-ui, sans-serif" font-size="9" font-weight="600">All Items</text>
    <rect x="116" y="158" width="67" height="22" rx="3" fill="#334155" />
    <text x="122" y="173" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="9">Beverages</text>
    <rect x="116" y="186" width="67" height="22" rx="3" fill="#334155" />
    <text x="122" y="201" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="9">Bakery</text>
    <rect x="116" y="214" width="67" height="22" rx="3" fill="#334155" />
    <text x="122" y="229" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="9">Grocery</text>

    <!-- Center Product Grid -->
    <rect x="194" y="122" width="180" height="204" rx="4" fill="#111827" />
    <!-- Item cards -->
    <rect x="200" y="128" width="52" height="44" rx="3" fill="#1e293b" />
    <rect x="200" y="158" width="52" height="14" fill="#0f766e" />
    <text x="206" y="169" fill="#ffffff" font-family="system-ui, sans-serif" font-size="8">Rs. 350</text>

    <rect x="258" y="128" width="52" height="44" rx="3" fill="#1e293b" />
    <rect x="258" y="158" width="52" height="14" fill="#0f766e" />
    <text x="264" y="169" fill="#ffffff" font-family="system-ui, sans-serif" font-size="8">Rs. 820</text>

    <rect x="316" y="128" width="52" height="44" rx="3" fill="#1e293b" />
    <rect x="316" y="158" width="52" height="14" fill="#0f766e" />
    <text x="322" y="169" fill="#ffffff" font-family="system-ui, sans-serif" font-size="8">Rs. 1,200</text>

    <rect x="200" y="178" width="52" height="44" rx="3" fill="#1e293b" />
    <rect x="200" y="208" width="52" height="14" fill="#0f766e" />
    <text x="206" y="219" fill="#ffffff" font-family="system-ui, sans-serif" font-size="8">Rs. 450</text>

    <rect x="258" y="178" width="52" height="44" rx="3" fill="#1e293b" />
    <rect x="258" y="208" width="52" height="14" fill="#0f766e" />
    <text x="264" y="219" fill="#ffffff" font-family="system-ui, sans-serif" font-size="8">Rs. 980</text>

    <rect x="316" y="178" width="52" height="44" rx="3" fill="#1e293b" />
    <rect x="316" y="208" width="52" height="14" fill="#0f766e" />
    <text x="322" y="219" fill="#ffffff" font-family="system-ui, sans-serif" font-size="8">Rs. 2,400</text>

    <!-- Right Cart/Bill Panel -->
    <rect x="380" y="122" width="108" height="204" rx="4" fill="#1e293b" />
    <text x="388" y="138" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="10" font-weight="bold">Bill Summary</text>
    <line x1="388" y1="145" x2="480" y2="145" stroke="#334155" stroke-width="1" />
    <text x="388" y="160" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="8">Item 1 x 2</text>
    <text x="450" y="160" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="8">Rs. 700</text>
    <text x="388" y="174" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="8">Item 2 x 1</text>
    <text x="450" y="174" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="8">Rs. 820</text>
    
    <rect x="386" y="260" width="96" height="26" rx="3" fill="#0f766e" />
    <text x="394" y="277" fill="#ffffff" font-family="system-ui, sans-serif" font-size="10" font-weight="bold">TOTAL: 1,520</text>

    <rect x="386" y="292" width="96" height="24" rx="3" fill="#f59e0b" />
    <text x="408" y="308" fill="#000000" font-family="system-ui, sans-serif" font-size="10" font-weight="bold">PAY NOW</text>
  </g>

  <!-- Power LED Indicator -->
  <circle cx="300" cy="358" r="3" fill="#10b981" />
  <circle cx="300" cy="358" r="6" fill="#10b981" opacity="0.3" />

  <!-- Badge Overlay -->
  <g transform="translate(430, 40)">
    <rect width="130" height="32" rx="16" fill="#0f766e" />
    <text x="65" y="20" fill="#ffffff" font-family="system-ui, sans-serif" font-size="12" font-weight="bold" text-anchor="middle">15.6" TOUCH</text>
  </g>
</svg>
