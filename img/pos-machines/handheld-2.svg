<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 500" width="100%" height="100%">
  <rect width="600" height="500" rx="16" fill="#f8fafc" />
  <circle cx="300" cy="250" r="180" fill="#f1f5f9" />
  <ellipse cx="300" cy="435" rx="100" ry="16" fill="#cbd5e1" opacity="0.6" />
  
  <!-- Handheld Device Body -->
  <g transform="translate(200, 60)">
    <rect x="0" y="0" width="200" height="370" rx="36" fill="#1e293b" />
    <rect x="4" y="4" width="192" height="362" rx="32" fill="#0f172a" />
    
    <!-- Thermal Printer Cover at top -->
    <rect x="25" y="16" width="150" height="55" rx="8" fill="#334155" />
    <line x1="35" y1="42" x2="165" y2="42" stroke="#1e293b" stroke-width="3" stroke-dasharray="4" />
    <!-- Paper receipt sticking out -->
    <rect x="50" y="2" width="100" height="20" rx="2" fill="#ffffff" stroke="#e2e8f0" />
    <line x1="60" y1="8" x2="140" y2="8" stroke="#94a3b8" stroke-width="1.5" />
    <line x1="60" y1="14" x2="120" y2="14" stroke="#94a3b8" stroke-width="1.5" />

    <!-- 5.5 Inch Touch Screen -->
    <rect x="15" y="85" width="170" height="235" rx="8" fill="#020617" />
    <!-- App UI -->
    <rect x="15" y="85" width="170" height="28" fill="#0f766e" />
    <text x="25" y="103" fill="#ffffff" font-family="system-ui, sans-serif" font-size="10" font-weight="bold">Mobile POS Billing</text>
    
    <rect x="25" y="125" width="70" height="40" rx="4" fill="#1e293b" />
    <text x="32" y="148" fill="#ffffff" font-family="system-ui, sans-serif" font-size="9">Coffee</text>
    
    <rect x="105" y="125" width="70" height="40" rx="4" fill="#1e293b" />
    <text x="112" y="148" fill="#ffffff" font-family="system-ui, sans-serif" font-size="9">Sandwich</text>
    
    <rect x="25" y="175" width="70" height="40" rx="4" fill="#1e293b" />
    <text x="32" y="198" fill="#ffffff" font-family="system-ui, sans-serif" font-size="9">Juice</text>
    
    <rect x="105" y="175" width="70" height="40" rx="4" fill="#1e293b" />
    <text x="112" y="198" fill="#ffffff" font-family="system-ui, sans-serif" font-size="9">Bakery</text>

    <!-- Bottom Charge Button -->
    <rect x="25" y="275" width="150" height="32" rx="6" fill="#10b981" />
    <text x="50" y="295" fill="#ffffff" font-family="system-ui, sans-serif" font-size="11" font-weight="bold">CHARGE Rs. 650</text>
    
    <!-- Home Bar / Buttons -->
    <circle cx="100" cy="340" r="10" fill="#334155" />
  </g>

  <g transform="translate(410, 40)">
    <rect width="140" height="32" rx="16" fill="#10b981" />
    <text x="70" y="20" fill="#ffffff" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" text-anchor="middle">BUILT-IN PRINTER</text>
  </g>
</svg>