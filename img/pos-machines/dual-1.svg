<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 500" width="100%" height="100%">
  <rect width="600" height="500" rx="16" fill="#f8fafc" />
  <circle cx="300" cy="240" r="190" fill="#f1f5f9" />
  <ellipse cx="300" cy="435" rx="145" ry="20" fill="#cbd5e1" opacity="0.6" />
  <!-- Stand base -->
  <rect x="180" y="415" width="240" height="24" rx="12" fill="#475569" />
  <path d="M 265 415 L 285 240 L 315 240 L 335 415 Z" fill="#334155" />
  
  <!-- Rear Customer Display (Seen angled behind or as secondary) -->
  <g transform="translate(180, 50)">
    <rect x="0" y="0" width="240" height="150" rx="8" fill="#1e293b" stroke="#334155" stroke-width="2" />
    <rect x="10" y="10" width="220" height="130" rx="4" fill="#090d16" />
    <text x="30" y="45" fill="#f59e0b" font-family="system-ui, sans-serif" font-size="14" font-weight="bold">WELCOME TO OUR STORE</text>
    <text x="30" y="75" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">Total Amount Due:</text>
    <text x="30" y="110" fill="#10b981" font-family="system-ui, sans-serif" font-size="22" font-weight="bold">Rs. 2,450.00</text>
  </g>

  <!-- Main Cashier Screen in Front -->
  <g transform="translate(80, 110)">
    <rect x="0" y="0" width="440" height="270" rx="12" fill="#1e293b" />
    <rect x="8" y="8" width="424" height="254" rx="6" fill="#0f172a" />
    <!-- Screen Header -->
    <rect x="8" y="8" width="424" height="30" rx="4" fill="#0f766e" />
    <text x="24" y="28" fill="#ffffff" font-family="system-ui, sans-serif" font-size="12" font-weight="bold">System-Navigator Dual POS</text>
    <!-- Content preview -->
    <rect x="16" y="46" width="280" height="206" rx="4" fill="#1e293b" />
    <rect x="304" y="46" width="120" height="206" rx="4" fill="#0f172a" />
    <text x="314" y="70" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="11" font-weight="bold">Order #1042</text>
    <rect x="312" y="195" width="104" height="28" rx="4" fill="#0f766e" />
    <text x="325" y="213" fill="#ffffff" font-family="system-ui, sans-serif" font-size="10" font-weight="bold">TOTAL: 2,450</text>
  </g>

  <g transform="translate(420, 30)">
    <rect width="150" height="32" rx="16" fill="#0284c7" />
    <text x="75" y="20" fill="#ffffff" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" text-anchor="middle">DUAL DISPLAY 15.6"</text>
  </g>
</svg>